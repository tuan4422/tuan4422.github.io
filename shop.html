<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shop - TUAN4422 MARKET</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

  <a class="logo" href="index.html">
    TUAN4422<span>MARKET</span>
  </a>

  <nav id="nav">
    <a href="index.html">Trang chủ</a>
    <a class="active" href="shop.html">Shop</a>
    <a href="server.html">Server</a>
    <a href="chat.html">Chat</a>
    <a href="forum.html">Forum</a>
    <a href="account.html">Tài khoản</a>
    <a href="wallet.html">Ví</a>
  </nav>

  <div class="header-actions">

    <button id="themeBtn" class="icon-btn">
      ☾
    </button>

    <button id="cartBtn" class="cart-btn">
      🛒
      <span id="cartCount">0</span>
    </button>

    <button id="menuBtn" class="menu-btn">
      ☰
    </button>

  </div>

</header>


<main class="page">

  <div class="page-heading">

    <div>
      <small class="small-title">
        TUAN4422 MARKET
      </small>

      <h1>Cửa hàng</h1>

      <p>
        Các sản phẩm số đang được cung cấp.
      </p>
    </div>

  </div>


  <div class="search-box">

    <input
      id="productSearch"
      type="search"
      placeholder="Tìm kiếm sản phẩm...">

  </div>


  <div
    id="productGrid"
    class="product-grid">
  </div>

</main>


<footer>

  <div class="footer-logo">
    TUAN4422<span>MARKET</span>
  </div>

  <p>
    © <span id="year"></span> TUAN4422 MARKET
  </p>

</footer>


<!-- PRODUCT MODAL -->

<div id="productModal" class="modal">

  <div class="modal-box product-modal">

    <div class="modal-header">

      <h2>Chi tiết sản phẩm</h2>

      <button
        id="productClose"
        class="modal-close"
        type="button">
        ×
      </button>

    </div>

    <div id="productDetail"></div>

  </div>

</div>


<!-- CART -->

<div id="cartModal" class="modal">

  <div class="modal-box">

    <div class="modal-header">

      <h2>🛒 Giỏ hàng</h2>

      <button
        id="cartClose"
        class="modal-close"
        type="button">
        ×
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="cart-total">

      <span>Tổng cộng</span>

      <strong id="cartTotal">0$</strong>

    </div>

    <button
      id="checkoutBtn"
      class="btn primary full"
      type="button">
      Thanh toán
    </button>

  </div>

</div>


<div id="toast"></div>

<script src="script.js"></script>

</body>
</html>

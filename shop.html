<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Shop - TUAN4422 MARKET</title>

  <link rel="stylesheet" href="style.css">
</head>

<body data-page="shop">

<header class="site-header">

  <div class="header-inner">

    <!-- LOGO -->

    <a href="index.html" class="brand">

      <span class="brand-mark">
        T
      </span>

      <span class="brand-text">

        <strong>
          TUAN4422
        </strong>

        <small>
          MARKET
        </small>

      </span>

    </a>


    <!-- MENU -->

    <nav class="main-nav" id="mainNav">

      <a
        href="index.html"
        data-page="home">
        Trang chủ
      </a>

      <a
        href="shop.html"
        data-page="shop">
        Shop
      </a>

      <a
        href="server.html"
        data-page="server">
        Server
      </a>

      <a
        href="chat.html"
        data-page="chat">
        Chat
      </a>

      <a
        href="forum.html"
        data-page="forum">
        Forum
      </a>

      <a
        href="account.html"
        data-page="account">
        Tài khoản
      </a>

      <a
        href="wallet.html"
        data-page="wallet">
        Ví
      </a>

      <!-- ADMIN -->

      <a
        href="admin.html"
        id="adminMenu"
        class="admin-only">
        Admin
      </a>

    </nav>


    <!-- HEADER BUTTONS -->

    <div class="header-tools">

      <button
        class="header-btn cart-btn"
        id="cartBtn"
        type="button">

        Giỏ hàng

        <span id="cartCount">
          0
        </span>

      </button>


      <button
        class="mobile-menu"
        id="menuBtn"
        type="button">

        ☰

      </button>

    </div>

  </div>

</header>


<!-- MAIN -->

<main class="page-container">


  <!-- TITLE -->

  <section class="page-heading">

    <div>

      <span class="eyebrow">
        TUAN4422 MARKET
      </span>

      <h1>
        Shop
      </h1>

      <p>
        Khám phá các sản phẩm đang được bán trên TUAN4422 MARKET.
      </p>

    </div>

  </section>


  <!-- SHOP TOOLBAR -->

  <section class="shop-toolbar">

    <div class="search-box">

      <input
        type="search"
        id="shopSearch"
        placeholder="Tìm kiếm sản phẩm..."
        autocomplete="off">

    </div>

  </section>


  <!-- PRODUCT LIST -->

  <section>

    <div
      class="product-grid"
      id="productGrid">

      <!-- script.js tự tạo sản phẩm -->

    </div>

  </section>


</main>


<!-- FOOTER -->

<footer class="site-footer">

  <div class="footer-inner">

    <div>

      <strong>
        TUAN4422 MARKET
      </strong>

      <p>
        Website marketplace của TUAN4422.
      </p>

    </div>


    <div class="footer-links">

      <a href="index.html">
        Trang chủ
      </a>

      <a href="shop.html">
        Shop
      </a>

      <a href="server.html">
        Server
      </a>

      <a href="account.html">
        Tài khoản
      </a>

    </div>

  </div>


  <div class="footer-bottom">

    © 2026 TUAN4422 MARKET

  </div>

</footer>



<!-- ================================================== -->
<!-- PRODUCT DETAIL MODAL -->
<!-- ================================================== -->

<div
  class="modal"
  id="productModal">

  <div class="modal-box">

    <div class="modal-header">

      <strong id="detailTitle">
        Chi tiết sản phẩm
      </strong>


      <button
        class="modal-close"
        data-close-modal="productModal"
        type="button">

        ×

      </button>

    </div>


    <div
      class="modal-body"
      id="detailContent">

    </div>

  </div>

</div>



<!-- ================================================== -->
<!-- CART MODAL -->
<!-- ================================================== -->

<div
  class="modal"
  id="cartModal">

  <div class="modal-box">

    <div class="modal-header">

      <strong>
        Giỏ hàng
      </strong>


      <button
        class="modal-close"
        data-close-modal="cartModal"
        type="button">

        ×

      </button>

    </div>


    <div class="modal-body">

      <div id="cartItems">

        <!-- script.js tạo giỏ hàng -->

      </div>


      <div class="cart-summary">

        <span>
          Tổng cộng
        </span>

        <strong id="cartTotal">
          0₫
        </strong>

      </div>


      <button
        class="btn btn-primary"
        id="checkoutBtn"
        type="button">

        Thanh toán

      </button>

    </div>

  </div>

</div>



<!-- TOAST -->

<div id="toast"></div>


<script src="script.js"></script>

</body>

</html>

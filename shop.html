<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cửa hàng - TUAN4422 MARKET</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        <span>TUAN</span>4422 <small>MARKET</small>
    </a>

    <button class="mobile-menu" id="mobileMenuBtn">☰</button>

    <nav id="mainNav">
        <a href="index.html">Trang chủ</a>
        <a href="shop.html" class="active">Cửa hàng</a>
        <a href="server.html">Minecraft Server</a>
        <a href="chat.html">Chat</a>
        <a href="forum.html">Forum</a>
        <a href="account.html">Tài khoản</a>
        <a href="wallet.html">Ví</a>
        <a href="admin.html" class="admin-only" id="adminMenu">Admin</a>
    </nav>

    <button class="theme-btn" id="themeBtn">☾</button>
</header>

<main class="page">

    <section class="page-title">
        <span class="section-label">MARKET</span>
        <h1>Cửa hàng</h1>
        <p>Khám phá các sản phẩm của TUAN4422 MARKET.</p>
    </section>

    <div class="shop-toolbar">

        <div class="search-box">
            <span>⌕</span>
            <input
                type="text"
                id="searchInput"
                placeholder="Tìm kiếm sản phẩm..."
            >
        </div>

        <button class="btn btn-secondary" id="cartBtn">
            🛒 Giỏ hàng
            <span id="cartCount" class="cart-count">0</span>
        </button>

    </div>

    <div class="category-bar">
        <button class="category active" data-category="all">Tất cả</button>
        <button class="category" data-category="Script">Script</button>
        <button class="category" data-category="Account">Account</button>
        <button class="category" data-category="Minecraft">Minecraft</button>
    </div>

    <div class="product-grid large-grid" id="productGrid"></div>

</main>

<div class="modal" id="productModal">
    <div class="modal-content">

        <button class="modal-close" data-close-modal>×</button>

        <h2 id="detailTitle">Sản phẩm</h2>

        <div id="detailContent"></div>

    </div>
</div>

<div class="modal" id="cartModal">
    <div class="modal-content">

        <button class="modal-close" data-close-modal>×</button>

        <h2>Giỏ hàng</h2>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-total">
            <span>Tổng cộng</span>
            <strong id="cartTotal">0$</strong>
        </div>

        <button class="btn btn-primary btn-block" id="checkoutBtn">
            Thanh toán
        </button>

    </div>
</div>

<div id="toast" class="toast"></div>

<script src="database.js"></script>
<script src="script.js"></script>

</body>
</html>

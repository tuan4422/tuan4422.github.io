<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - TUAN4422 MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="shop">

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <span class="brand-mark">T</span>
      <span class="brand-text">
        <strong>TUAN4422</strong>
        <small>MARKET</small>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-page="home">Trang chủ</a>
      <a href="shop.html" data-page="shop">Shop</a>
      <a href="server.html" data-page="server">Server</a>
      <a href="chat.html" data-page="chat">Chat</a>
      <a href="forum.html" data-page="forum">Forum</a>
      <a href="account.html" data-page="account">Tài khoản</a>
      <a href="wallet.html" data-page="wallet">Ví</a>
    </nav>

    <div class="header-tools">
      <button class="header-btn cart-btn" id="cartBtn">
        Giỏ hàng
        <span class="cart-count" id="cartCount">0</span>
      </button>

      <button class="mobile-menu" id="menuBtn">☰</button>
    </div>

  </div>
</header>

<main class="page">
  <div class="container">

    <div class="page-heading">
      <h1>Shop</h1>
      <p>Chọn sản phẩm bạn muốn mua.</p>
    </div>

    <div class="toolbar">
      <input
        class="search"
        id="productSearch"
        type="search"
        placeholder="Tìm kiếm sản phẩm..."
      >
    </div>

    <div class="product-grid" id="productGrid"></div>

  </div>
</main>

<footer>
  <div class="footer-inner">
    <div>
      <div class="footer-logo">TUAN4422 MARKET</div>
      <div>Shop sản phẩm số.</div>
    </div>
    <div>© 2026 TUAN4422</div>
  </div>
</footer>

<div class="modal" id="cartModal">
  <div class="modal-box">

    <div class="modal-header">
      <strong>Giỏ hàng</strong>
      <button class="modal-close" data-close-modal="cartModal">×</button>
    </div>

    <div class="modal-body">

      <div id="cartItems"></div>

      <div class="cart-total">
        <span>Tổng</span>
        <span id="cartTotal">0$</span>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" data-close-modal="cartModal">
          Đóng
        </button>

        <button class="btn btn-primary" id="checkoutBtn">
          Thanh toán
        </button>
      </div>

    </div>

  </div>
</div>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>

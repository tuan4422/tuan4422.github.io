<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - TUAN4422 MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <div class="brand-logo">T</div>
      <div class="brand-text">
        <strong>TUAN4422</strong>
        <span>MARKET</span>
      </div>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="index.html">Trang chủ</a>
      <a href="shop.html">Shop</a>
      <a href="server.html">Server</a>
      <a href="chat.html" class="active">Chat</a>
      <a href="forum.html">Forum</a>
      <a href="account.html">Tài khoản</a>
      <a href="wallet.html">Ví</a>
      <a href="admin.html" id="adminMenu" class="admin-only">Admin</a>
    </nav>

    <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>

  </div>
</header>

<main>

  <section class="page-hero">
    <div class="eyebrow">COMMUNITY</div>
    <h1>Chat</h1>
    <p>Trò chuyện cùng cộng đồng TUAN4422.</p>
  </section>

  <section class="section" style="padding-top:20px">

    <div class="chat-layout">

      <aside class="chat-sidebar">
        <h3>Kênh</h3>

        <div class="chat-room active">
          # chung
        </div>

        <div class="chat-room">
          # minecraft
        </div>

        <div class="chat-room">
          # script
        </div>
      </aside>

      <div class="chat-main">

        <div class="chat-header">
          <strong># chung</strong>
          <span>Kênh trò chuyện cộng đồng</span>
        </div>

        <div
          class="chat-messages"
          id="chatMessages"
        ></div>

        <form
          class="chat-form"
          id="chatForm"
        >

          <input
            id="chatInput"
            type="text"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
            style="
              flex:1;
              min-height:44px;
              padding:0 13px;
              border:1px solid var(--border);
              border-radius:11px;
              background:#071421;
              color:white;
              outline:none;
            "
          >

          <button class="btn btn-primary" type="submit">
            Gửi
          </button>

        </form>

      </div>

    </div>

  </section>

</main>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <strong>TUAN4422 MARKET</strong>
      <p>Cộng đồng TUAN4422.</p>
    </div>
  </div>
</footer>

<div class="toast" id="toast"></div>

<script src="script.js"></script>

</body>
</html>

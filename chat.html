<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - TUAN4422 MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="chat">

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <span class="brand-mark">T</span>
      <span class="brand-text">
        <strong>TUAN4422</strong>
        <small>MARKET</small>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-page="home">Trang chủ</a>
      <a href="shop.html" data-page="shop">Shop</a>
      <a href="server.html" data-page="server">Server</a>
      <a href="chat.html" data-page="chat">Chat</a>
      <a href="forum.html" data-page="forum">Forum</a>
      <a href="account.html" data-page="account">Tài khoản</a>
      <a href="wallet.html" data-page="wallet">Ví</a>
    </nav>

    <div class="header-tools">
      <button class="header-btn cart-btn" id="cartBtn">
        Giỏ hàng
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="mobile-menu" id="menuBtn">☰</button>
    </div>

  </div>
</header>

<main class="page">
  <div class="container">

    <div class="page-heading">
      <h1>Chat</h1>
      <p>Khu vực trò chuyện demo.</p>
    </div>

    <div class="chat-layout">

      <aside class="chat-users">

        <h3>Thành viên</h3>

        <div class="user-row">
          <div class="avatar">T</div>
          <div>
            TUAN4422
            <small>Online</small>
          </div>
        </div>

        <div class="user-row">
          <div class="avatar">M</div>
          <div>
            Member
            <small>Online</small>
          </div>
        </div>

      </aside>

      <section class="chat-main">

        <div class="chat-messages" id="chatMessages"></div>

        <form class="chat-form" id="chatForm">

          <input
            id="chatInput"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
          >

          <button class="btn btn-primary">
            Gửi
          </button>

        </form>

      </section>

    </div>

  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">TUAN4422 MARKET</div>
    <div>© 2026 TUAN4422</div>
  </div>
</footer>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>

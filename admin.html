<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - TUAN4422</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        <span>TUAN</span>4422 <small>MARKET</small>
    </a>

    <button class="mobile-menu" id="mobileMenuBtn">☰</button>

    <nav id="mainNav">
        <a href="index.html">Trang chủ</a>
        <a href="shop.html">Cửa hàng</a>
        <a href="server.html">Minecraft Server</a>
        <a href="chat.html">Chat</a>
        <a href="forum.html">Forum</a>
        <a href="account.html">Tài khoản</a>
        <a href="wallet.html">Ví</a>
        <a href="admin.html" class="active">Admin</a>
    </nav>

    <button class="theme-btn" id="themeBtn">☾</button>
</header>

<main class="page">

    <section class="page-title">
        <span class="section-label">CONTROL PANEL</span>
        <h1>Admin</h1>
        <p>Quản lý TUAN4422 MARKET.</p>
    </section>

    <section id="adminLoginSection" class="admin-login panel">

        <h2>Đăng nhập Admin</h2>

        <p class="description">
            Demo Admin: <strong>admin</strong> /
            <strong>tuan4422</strong>
        </p>

        <form id="adminLoginForm">

            <input
                id="adminUsername"
                class="input"
                type="text"
                placeholder="Tên Admin"
                required
            >

            <input
                id="adminPassword"
                class="input"
                type="password"
                placeholder="Mật khẩu"
                required
            >

            <button class="btn btn-primary">
                Đăng nhập
            </button>

        </form>

    </section>

    <section id="adminDashboard" class="hidden">

        <div class="admin-stats">

            <div class="stat-card">
                <span>SẢN PHẨM</span>
                <strong id="adminProductCount">0</strong>
            </div>

            <div class="stat-card">
                <span>ĐƠN HÀNG</span>
                <strong id="adminOrderCount">0</strong>
            </div>

            <div class="stat-card">
                <span>USER</span>
                <strong id="adminUserCount">0</strong>
            </div>

        </div>

        <div class="panel">

            <div class="panel-head">
                <h2>Thêm / chỉnh sửa sản phẩm</h2>
            </div>

            <form id="productForm" class="admin-form">

                <input type="hidden" id="productId">

                <input
                    id="productName"
                    class="input"
                    placeholder="Tên sản phẩm"
                    required
                >

                <select id="productCategory" class="input">
                    <option value="Script">Script</option>
                    <option value="Account">Account</option>
                    <option value="Minecraft">Minecraft</option>
                </select>

                <input
                    id="productPrice"
                    class="input"
                    type="number"
                    placeholder="Giá"
                    required
                >

                <input
                    id="productImage"
                    class="input"
                    placeholder="Ảnh sản phẩm, ví dụ: images/products/script-ui.png"
                >

                <textarea
                    id="productDescription"
                    class="input textarea"
                    placeholder="Mô tả sản phẩm"
                ></textarea>

                <label class="checkbox">
                    <input type="checkbox" id="productFeatured">
                    Sản phẩm nổi bật
                </label>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveProductBtn"
                    >
                        Lưu sản phẩm
                    </button>

                    <button
                        type="button"
                        class="btn btn-secondary hidden"
                        id="cancelEditBtn"
                    >
                        Hủy chỉnh sửa
                    </button>

                </div>

            </form>

        </div>

        <div class="panel">

            <div class="panel-head">
                <h2>Quản lý sản phẩm</h2>

                <button
                    class="btn btn-secondary"
                    id="refreshProductsBtn"
                >
                    Làm mới
                </button>
            </div>

            <div id="adminProductList"></div>

        </div>

        <div class="panel">

            <div class="panel-head">
                <h2>Đơn hàng</h2>

                <button
                    class="btn btn-secondary"
                    id="refreshOrdersBtn"
                >
                    Làm mới
                </button>
            </div>

            <div id="adminOrderList"></div>

        </div>

        <button id="adminLogoutBtn" class="btn btn-danger">
            Đăng xuất Admin
        </button>

    </section>

</main>

<div id="toast" class="toast"></div>

<script src="database.js"></script>
<script src="script.js"></script>

</body>
</html>

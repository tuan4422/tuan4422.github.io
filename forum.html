<header class="header">

    <button class="mobile-menu" id="mobileMenuBtn">☰</button>

        <h1>Forum</h1>
        <p>Nơi chia sẻ và thảo luận.</p>
    </section>

    <div class="forum-layout">

        <div class="panel">

            <form id="forumForm">

                <input
                    id="forumTitle"
                    class="input"
                    type="text"
                    placeholder="Tiêu đề bài viết"
                    required
                >

                <textarea
                    id="forumContent"
                    class="input textarea"
                    placeholder="Nội dung..."
                    required
                ></textarea>

                <button class="btn btn-primary" type="submit">
                    Đăng bài
                </button>

            </form>

        </div>

        <div id="forumList" class="forum-list"></div>

    </div>

<div id="toast" class="toast"></div>

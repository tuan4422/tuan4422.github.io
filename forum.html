<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forum - TUAN4422 MARKET</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-page="forum">

<header class="site-header">
  <div class="header-inner">

    <a href="index.html" class="brand">
      <span class="brand-mark">T</span>
      <span class="brand-text">
        <strong>TUAN4422</strong>
        <small>MARKET</small>
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="index.html" data-page="home">Trang chủ</a>
      <a href="shop.html" data-page="shop">Shop</a>
      <a href="server.html" data-page="server">Server</a>
      <a href="chat.html" data-page="chat">Chat</a>
      <a href="forum.html" data-page="forum">Forum</a>
      <a href="account.html" data-page="account">Tài khoản</a>
      <a href="wallet.html" data-page="wallet">Ví</a>
    </nav>

    <div class="header-tools">
      <button class="header-btn cart-btn" id="cartBtn">
        Giỏ hàng
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="mobile-menu" id="menuBtn">☰</button>
    </div>

  </div>
</header>

<main class="page">
  <div class="container">

    <div class="page-heading">
      <h1>Forum</h1>
      <p>Nơi đăng bài và trao đổi với cộng đồng.</p>
    </div>

    <div class="dashboard-grid">

      <div class="panel">

        <h2>Đăng bài</h2>

        <p class="panel-description">
          Tạo một bài viết mới.
        </p>

        <form id="forumForm">

          <div class="form-group">
            <label>Tiêu đề</label>

            <input
              class="form-input"
              id="forumTitle"
              placeholder="Tiêu đề bài viết"
              required
            >
          </div>

          <div class="form-group">
            <label>Nội dung</label>

            <textarea
              class="form-input"
              id="forumContent"
              rows="6"
              style="padding-top:12px"
              placeholder="Nội dung..."
              required
            ></textarea>
          </div>

          <button class="btn btn-primary">
            Đăng bài
          </button>

        </form>

      </div>

      <div>

        <div class="section-heading" style="margin-bottom:12px">
          <div>
            <h2>Bài viết</h2>
          </div>
        </div>

        <div class="forum-list" id="forumList"></div>

      </div>

    </div>

  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">TUAN4422 MARKET</div>
    <div>© 2026 TUAN4422</div>
  </div>
</footer>

<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
